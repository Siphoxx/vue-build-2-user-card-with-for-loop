<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <title>Build 2-Team List using For Loop</title>

    <style>
  .card {
    background-color: hsla(92, 87%, 47%, 0.3);
    width: 200px;
    padding: 10px;
    margin: 8px 0;
    border-radius: 8px;
  }

    </style>
</head>
<body>
    <div id="app">
        <user-card
            v-for = "user in users"
            :key = "user.id"
            :name = "user.name"
            :role = "user.role">
        </user-card>
    </div>

    <script>
        const { createApp, ref}= Vue;

        const app = createApp({
            setup() {

                const users = ref([
                    {id:1, name:"Thandi",role:"Studio Owner"},
                    {id:2, name:"Sipho", role:"Developer" },
                    {id:3, name:"Lerato", role: "Trainer"}, 
                     {id:4, name:"Linda", role: "IT"}, 

                    ]);

                    return{users}

            },

        });

        app.component ("user-card", {
            props: ["name", "role"],
            template:`
            <div class="card">
                <h3>

                    {{ name}}
                    
                
                </h3>
                <p>{{ role}}</p>
            
            </div>`,
        });
         app.mount("#app");
    </script>   
    
</body>
</html>
